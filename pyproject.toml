[project]
name = "kupio-backend"
version = "0.1.0"
description = ""
authors = [
    { name = "Vadim Popovych", email = "zyzel19@gmail.com" },
    { name = "Yurii Oliinyk", email = "oliinykyurii123@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy[async] (>=2.0.48,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "msgspec (>=0.20.0,<0.21.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "redis[asyncio] (>=7.3.0,<8.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[argon] (>=1.7.4,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pydantic-extra-types (>=2.11.1,<3.0.0)",
    "phonenumbers (>=9.0.26,<10.0.0)",
    "greenlet (>=3.3.2,<4.0.0)",
    "aiohttp (>=3.13.4,<4.0.0)",
    "streaq (>=6.3.3,<7.0.0)",
    "stripe[async] (>=15.0.1,<16.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.5"
pre-commit = "^4.5.1"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
aiosqlite = "^0.21.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
