# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'poetry run ruff check --fix || true'
        language: system
        types: [python]
        args: [--fix]

      - id: ruff-format
        name: ruff-format
        entry: bash -c 'poetry run ruff format || true'
        language: system
        types: [python]
